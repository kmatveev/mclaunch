plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.0'
}

mainClassName = 'net.minecraft.launcher.Main'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
    mavenCentral()
    jcenter()
    maven {
        name = "mojang"
        url = "https://libraries.minecraft.net/"
    }
}

dependencies {
    implementation('com.google.code.gson:gson:2.3.1')
    implementation('com.google.code.findbugs:jsr305:3.0.0')
    implementation('com.google.guava:guava:18.0')
    implementation('net.sf.jopt-simple:jopt-simple:4.8')

    implementation('org.apache.commons:commons-lang3:3.3.2')
    implementation('commons-io:commons-io:2.4')
    implementation('commons-codec:commons-codec:1.10')
    //compile group: 'org.apache.logging.log4j', name: 'log4j-api', version: '2.5' // Not needed?
    implementation('org.apache.logging.log4j:log4j-core:2.5')
    implementation('org.apache.maven.plugins:maven-shade-plugin:3.1.0')
}

shadowJar {
    exclude '**/Log4j2Plugins.dat'
    //transform(com.github.jengelman.gradle.plugins.shadow.transformers.Log4j2PluginsCacheFileTransformer) // Not needed?
}
